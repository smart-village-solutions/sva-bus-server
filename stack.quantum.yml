services:
  bus-api:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${QUANTUM_NODE}
      restart_policy:
        condition: on-failure
      labels:
        traefik.enable: 'true'
        traefik.port: '3000'
        traefik.docker.network: public
        traefik.frontend.rule: Host:${PUBLIC_DOMAIN}
        traefik.http.routers.bus-api-bus-api.rule: Host(`${PUBLIC_DOMAIN}`)
        traefik.http.routers.bus-api-bus-api.tls: 'true'
        traefik.http.routers.bus-api-bus-api.tls.certresolver: default
        traefik.http.services.bus-api-bus-api.loadbalancer.server.port: '3000'

  redis:
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == ${QUANTUM_NODE}
      restart_policy:
        condition: on-failure
